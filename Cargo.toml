[package]
name = "oxide-studio"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "A fast, native Rust desktop SQL workspace for SQLite databases"
license = "MIT"
readme = "README.md"
keywords = ["rust", "sqlite", "sql", "desktop", "egui"]
categories = ["database", "gui"]

[dependencies]
anyhow = "1.0.100"
csv = "1.4.0"
eframe = "0.37.0"
rfd = "0.17.2"
rusqlite = { version = "0.41.1", features = ["bundled"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.23.0"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
panic = "abort"

[profile.dev]
debug = 1

[profile.dev.package."*"]
opt-level = 2
